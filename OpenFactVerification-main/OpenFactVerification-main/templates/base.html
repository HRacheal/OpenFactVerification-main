<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kweli Lens AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/truthlens.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">◎</span> Kweli Lens AI</a>
      <nav><a href="{{ url_for('index') }}">New check</a> <a href="{{ url_for('about') }}">How it works</a></nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer wrap">
    <p>Kweli Lens AI assists journalists; it does not replace editorial judgement. Built on
      <a href="https://github.com/Libr-AI/OpenFactVerification" rel="noopener noreferrer">Loki (OpenFactVerification)</a>, MIT licence.</p>
  </footer>
  <script src="{{ url_for('static', filename='js/truthlens.js') }}"></script>
</body>
</html>
